services:
  legen:
    build:
      context: .
      args:
        PYTORCH_INSTALL_CUDA: ${PYTORCH_INSTALL_CUDA:-true}
        PYTORCH_CUDA_INDEX_URL: ${PYTORCH_CUDA_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    image: legen:local
    volumes:
      - ./data:/data
      - ./downloads:/app/downloads
      - ./softsubs_m:/app/softsubs_m
      - ./hardsubs_m:/app/hardsubs_m
    command: ["--help"]
